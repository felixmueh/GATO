[build-system]
requires = ["setuptools", "scikit-build-core", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "gato"
version = "0.0.2"
authors = [
    { name="Alex Du", email="alexander.du@columbia.edu" },
]
description = "GPU-accelerated batched trajectory optimization"
readme = "README.md"
requires-python = "==3.10.12"
dependencies = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "numpy>=2.2.3",
    "scipy>=1.15.2",
    "matplotlib>=3.10.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "pin>=3.4.0",
    "osqp>=0.6.7.post3",
    "meshcat>=0.3.2",
    "ninja>=1.11.1.4",
    "pybind11>=2.13.6",
    # PyQt5's bundled Qt wheels are unavailable on Linux ARM64; plots use Agg
    # or Jupyter's inline backend there.
    "pyqt5>=5.15.11; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "tdqm>=0.0.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12.4 PyTorch wheels are unavailable on Linux ARM64. GATO runs its
# solver through native CUDA bindings, so CPU PyTorch suffices there.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu124", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu124", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu124", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
include = ["bsqp"]

[tool.pytest.ini_options]
markers = [
    "cuda: requires a CUDA-capable runtime environment",
    "tracking: runs a short end-to-end MPC tracking scenario",
    "performance: collects timing metrics and optional artifacts",
]
